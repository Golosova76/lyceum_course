<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Casco</title>
</head>
<body>
<div class="wrapper">
    <header class="header">
        <h1 class="header__title visually-hidden">Пылесос 3442</h1>
    </header>
    <main class="main">
        <div class="main__wrapper">
            <section class="main__score buy-score">
                <h2 class="buy-score__title">Пылесос 3442</h2>
                <div class="buy-score__body">
                    <div class="buy-score__image">
                        <div class="buy-score__img">
                            <img class="image-hoover" src="./img/hoover_big.png" alt="Hoover">
                        </div>
                        <div class="buy-score__slider slider">
                            <button type="button" class="slider__button slider__button_prev" aria-label="Прокрутить вверх">
                                <svg width="33" height="33" viewBox="0 0 33 33" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M16.5 26.125L16.5 6.875" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                    <path d="M6.25 16.5L15.875 6.875L25.5 16.5" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                            </button>
                            <div class="slider__viewport">
                                <div class="slider__track">
                                    <div class="slider__slide">
                                        <img class="slider__image" src="./img/hoover_small.png" alt="Пылесос 1">
                                    </div>
                                    <div class="slider__slide">
                                        <img class="slider__image" src="./img/hoover_small.png" alt="Пылесос 1">
                                    </div>
                                    <div class="slider__slide">
                                        <img class="slider__image" src="./img/hoover_small.png" alt="Пылесос 1">
                                    </div>
                                    <div class="slider__slide">
                                        <img class="slider__image" src="./img/hoover_small.png" alt="Пылесос 1">
                                    </div>
                                    <div class="slider__slide">
                                        <img class="slider__image" src="./img/hoover_small.png" alt="Пылесос 1">
                                    </div>
                                    <div class="slider__slide">
                                        <img class="slider__image" src="./img/hoover_small.png" alt="Пылесос 1">
                                    </div>
                                    <div class="slider__slide">
                                        <img class="slider__image" src="./img/hoover_small.png" alt="Пылесос 1">
                                    </div>
                                    <div class="slider__slide">
                                        <img class="slider__image" src="./img/hoover_small.png" alt="Пылесос 1">
                                    </div>
                                </div>
                            </div>
                            <button type="button" class="slider__button slider__button_next" aria-label="Прокрутить вниз">
                                <svg width="33" height="33" viewBox="0 0 33 33" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M16.5 6.875L16.5 26.125" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                    <path d="M25.75 16.5L16.125 26.125L6.5 16.5" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="buy-score__score rating-card">
                        <div class="rating-card__summary">
                            <div class="rating-card__score">4,9</div>
                            <div class="rating-card__title">Оценка владельцев</div>
                        </div>
                        <div class="rating-card__metrics">
                            <ul class="rating-card__list">
                                <li class="rating-card__item">
                                    <span class="rating-card__label">Качество уборки</span>
                                    <div class="rating-card__progress"></div>
                                    <span class="rating-card__value">4,9</span>
                                </li>
                                <li class="rating-card__item">
                                    <span class="rating-card__label">Удобство</span>
                                    <div class="rating-card__progress"></div>
                                    <span class="rating-card__value">4,9</span>
                                </li>
                                <li class="rating-card__item">
                                    <span class="rating-card__label">Вес</span>
                                    <div class="rating-card__progress"></div>
                                    <span class="rating-card__value">4,9</span>
                                </li>
                                <li class="rating-card__item">
                                    <span class="rating-card__label">Маневренность</span>
                                    <div class="rating-card__progress"></div>
                                    <span class="rating-card__value">4,9</span>
                                </li>
                                <li class="rating-card__item">
                                    <span class="rating-card__label">Простота очистки</span>
                                    <div class="rating-card__progress"></div>
                                    <span class="rating-card__value">4,9</span>
                                </li>
                            </ul>
                        </div>
                        <div class="rating-card__footer">
                            <div class="rating-card__product-name">Пылесос 3442</div>
                            <div class="rating-card__actions button-rating-card">
                                <button type="button" class="button-rating-card__dislike">
                                    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M15.6826 12.0001L11.6826 21.0001C10.887 21.0001 10.1239 20.6841 9.5613 20.1214C8.99869 19.5588 8.68262 18.7958 8.68262 18.0001L8.68262 14.0001L3.02262 14.0001C2.73271 14.0034 2.44555 13.9436 2.18105 13.8249C1.91654 13.7062 1.681 13.5314 1.49076 13.3126C1.30052 13.0938 1.16011 12.8363 1.07928 12.5579C0.998443 12.2794 0.979111 11.9868 1.02262 11.7001L2.40262 2.70012C2.47494 2.22322 2.71718 1.78851 3.08471 1.47611C3.45224 1.16372 3.92029 0.994668 4.40262 1.00012L15.6826 1.00012M15.6826 12.0001L15.6826 1.00012M15.6826 12.0001L18.6826 12.0001C19.2131 12.0001 19.7218 11.7894 20.0968 11.4143C20.4719 11.0393 20.6826 10.5306 20.6826 10.0001L20.6826 3.00012C20.6826 2.46969 20.4719 1.96098 20.0968 1.58591C19.7218 1.21084 19.2131 1.00012 18.6826 1.00012L15.6826 1.00012" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                    </svg>
                                    <span class="button-rating-card__count">2</span>
                                </button>
                                <button type="button" class="button-rating-card__like">
                                    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M6 10L10 1C10.7956 1 11.5587 1.31607 12.1213 1.87868C12.6839 2.44129 13 3.20435 13 4V8H18.66C18.9499 7.99672 19.2371 8.0565 19.5016 8.17522C19.7661 8.29393 20.0016 8.46873 20.1919 8.68751C20.3821 8.90629 20.5225 9.16382 20.6033 9.44225C20.6842 9.72068 20.7035 10.0134 20.66 10.3L19.28 19.3C19.2077 19.7769 18.9654 20.2116 18.5979 20.524C18.2304 20.8364 17.7623 21.0055 17.28 21H6M6 10V21M6 10H3C2.46957 10 1.96086 10.2107 1.58579 10.5858C1.21071 10.9609 1 11.4696 1 12V19C1 19.5304 1.21071 20.0391 1.58579 20.4142C1.96086 20.7893 2.46957 21 3 21H6" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                    </svg>
                                    <span class="button-rating-card__count">8</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <footer class="footer">
        <div class="footer__container"></div>
    </footer>
</div>
<script src="js/script.js"></script>
</body>
</html>
